name: Update Jalebi Jams playlist

on:
  push:
    paths:
      - "music/songs/**"
      - "music/overrides.json"
      - "scripts/build_library.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install numpy
      - name: Build playlist
        run: python scripts/build_library.py
      - name: Save playlist
        run: |
          git config user.name "Jalebi Jams Robot"
          git config user.email "actions@users.noreply.github.com"
          git add music/library.json
          git diff --staged --quiet || (git commit -m "Update playlist" && git push)
